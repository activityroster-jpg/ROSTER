# The hourly tick on Cloudflare's scheduler (see index.ts). Secrets: CRON_SECRET,
# the same value as the app's OUTREACH_CRON_SECRET, set by the deploy workflows.
name = "roster-tick"
main = "index.ts"
compatibility_date = "2025-01-01"
workers_dev = false

[triggers]
crons = ["5 * * * *"]

[vars]
TICK_URL = "https://activityroster.com/api/outreach/tick"

[env.staging]
name = "roster-tick-staging"
workers_dev = false

[env.staging.triggers]
crons = ["20 * * * *"]

[env.staging.vars]
TICK_URL = "https://staging.activityroster.com/api/outreach/tick"
