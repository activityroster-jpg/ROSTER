name: Deploy staging

# Every push to the working branch goes to staging automatically (after
# typecheck and tests), so changes can be tried at staging.activityroster.com
# before anyone presses the production button. Migrations run first against
# the staging database.

on:
  push:
    branches: ["claude/new-session-2wxbwe"]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APEX_DOMAIN: staging.activityroster.com
    steps:
      - name: Check staging is provisioned
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::No Cloudflare token; nothing deployed."; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.ready == 'true'
      - name: Check resource ids are filled in
        if: steps.ready.outputs.ready == 'true'
        run: |
          if grep -q "STAGING_D1_ID\|STAGING_KV_ID" wrangler.toml; then
            echo "::warning::Staging is not provisioned yet. Run the 'Provision staging' workflow once."
            exit 0
          fi
          echo "provisioned=true" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        if: env.provisioned == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
        if: env.provisioned == 'true'
      - name: Typecheck and tests
        if: env.provisioned == 'true'
        run: |
          npm run typecheck:core
          npm run test
      - name: Build
        if: env.provisioned == 'true'
        run: npx opennextjs-cloudflare build
      - name: Apply migrations (staging)
        if: env.provisioned == 'true'
        run: npx wrangler d1 migrations apply activityroster-staging --env staging --remote
      - name: Deploy staging
        if: env.provisioned == 'true'
        run: npx wrangler deploy --env staging
      - name: Deploy the hourly tick (staging)
        if: env.provisioned == 'true'
        env:
          OUTREACH_CRON_SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
        run: |
          npx wrangler deploy -c workers/tick/wrangler.toml --env staging
          if [ -n "$OUTREACH_CRON_SECRET" ]; then
            printf '%s' "$OUTREACH_CRON_SECRET" | npx wrangler secret put CRON_SECRET -c workers/tick/wrangler.toml --env staging
          fi
      - name: Smoke test
        if: env.provisioned == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            home="$(curl -sS -L -o /dev/null -w '%{http_code} %{url_effective}' https://staging.activityroster.com/ || true)"
            if curl -fsS https://staging.activityroster.com/api/health | grep -q '"ok":true' && [ "$home" = "200 https://staging.activityroster.com/" ]; then echo "staging healthy, home page served"; exit 0; fi
            echo "home page check: $home"
            sleep 10
          done
          hdr="$(curl -sS -o /dev/null -D - https://staging.activityroster.com/api/health || true)"
          if printf '%s' "$hdr" | grep -qi '^cf-mitigated: challenge'; then
            echo "::error::Cloudflare challenged the smoke test (HTTP 403, cf-mitigated: challenge). This is Bot Fight Mode blocking GitHub's test request, not the app: staging is deployed but unverified. Turn it off: Cloudflare dashboard → activityroster.com → Security → Bots → Bot Fight Mode → Off."
          else
            echo "::error::Staging health check failed after deploy (HTTP $(printf '%s' "$hdr" | head -1 | awk '{print $2}') from /api/health)."
          fi
          exit 1
