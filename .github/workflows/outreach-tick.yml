name: Hourly tick (backup)

# BACKUP pinger. The primary heartbeat is the Cloudflare cron in workers/tick
# (GitHub's scheduler skips hours). This stays as a second caller; the tick is
# idempotent, so a double call does nothing twice. Once an hour, every day. It wakes the outreach
# agent (which keeps to each campaign's own hours and daily cap) and sends the
# opt-in morning rota digest to centres whose chosen hour it is.
# Needs one repository secret: OUTREACH_CRON_SECRET, identical to the
# Cloudflare Worker secret of the same name. See docs/outreach.md.

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the tick route
        env:
          SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::Repository secret OUTREACH_CRON_SECRET is not set (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsS -X POST -H "x-outreach-secret: $SECRET" https://activityroster.com/api/outreach/tick
