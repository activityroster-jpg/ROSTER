name: Sync booking integrations

# Daily scheduled sync of every centre's connected booking-system feeds.
# It calls the guarded endpoint /api/cron/sync-integrations with a shared secret.
#
# Set two repository secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET  — the same value you set as a Worker secret (wrangler secret put CRON_SECRET)
#   APP_BASE_URL — e.g. https://activityroster.com  (no trailing slash)

on:
  schedule:
    - cron: "20 5 * * *" # 05:20 UTC daily
  workflow_dispatch: {} # allow manual runs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger integration sync
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ] || [ -z "${{ secrets.APP_BASE_URL }}" ]; then
            echo "CRON_SECRET / APP_BASE_URL secrets not set — skipping"; exit 0
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/sync-integrations")
          echo "HTTP $code"; cat /tmp/out.json
          test "$code" = "200"
