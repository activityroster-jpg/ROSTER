name: Probe production
# Read-only: fetches a few pages on production and staging and records the
# status code and time taken as annotations (readable without the job log).
# Runs on demand, every two hours through the working day (so there is a
# response-time history to look back on when something feels slow), and
# whenever this file changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6-22/2 * * *"
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch pages
        run: |
          for u in \
            https://activityroster.com/api/health https://activityroster.com/sign-in https://activityroster.com/admin https://activityroster.com/go https://probe.activityroster.com/office https://probe.activityroster.com/sign-in \
            https://staging.activityroster.com/api/health https://staging.activityroster.com/sign-in https://staging.activityroster.com/admin https://staging.activityroster.com/dev https://probe.staging.activityroster.com/office; do
            out=$(curl -sS -o /tmp/body -w '%{http_code} %{time_total}s' --max-time 40 "$u" 2>&1 || echo "ERR $?")
            echo "::warning::$out  $u  | $(head -c 160 /tmp/body | tr '\n' ' ')"
          done
      - name: Which build is live
        run: |
          for host in activityroster.com staging.activityroster.com; do
            echo "::warning::$host build: $(curl -sS --max-time 30 "https://$host/api/version")"
          done
