name: Restore rehearsal

# Proves the backups can actually be restored (compliance spec: a quarterly restore
# test; this runs monthly). Last night's encrypted export is decrypted and loaded into
# a THROWAWAY database in the EU jurisdiction, every table's row count is checked
# against the backup file, newer migrations are applied on top, and the throwaway
# database is deleted. Production and staging are never written to (staging can send
# email, so real people's data is not loaded there). The result is emailed to the
# platform owner and shown on the Dev Center overview. Case B in docs/runbooks/restore.md.

on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:
    inputs:
      file:
        description: "Backup object (leave empty for last night's), e.g. daily/2026-10-05.sql.gz.enc"
        required: false
        default: ""

concurrency:
  group: restore-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: activityroster-backups
      SCRATCH: activityroster-restore-rehearsal
    steps:
      - name: Check required secrets
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not set."; exit 1; fi
          if [ -z "$PASS" ]; then echo "::error::BACKUP_PASSPHRASE is not set."; exit 1; fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install

      - name: Download and decrypt the backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          WANTED: ${{ inputs.file }}
        run: |
          set -euo pipefail
          if [ -n "$WANTED" ]; then
            case "$WANTED" in daily/*|monthly/*) ;; *) echo "::error::File must start with daily/ or monthly/."; exit 1;; esac
            FILE="$WANTED"
            npx wrangler r2 object get "$BUCKET/$FILE" --file backup.enc -J eu --remote
          else
            FILE="daily/$(date -u +%F).sql.gz.enc"
            if ! npx wrangler r2 object get "$BUCKET/$FILE" --file backup.enc -J eu --remote; then
              FILE="daily/$(date -u -d yesterday +%F).sql.gz.enc"
              npx wrangler r2 object get "$BUCKET/$FILE" --file backup.enc -J eu --remote
            fi
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup.enc -pass env:BACKUP_PASSPHRASE | gunzip -c > backup.sql
          rm -f backup.enc
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "### Restore rehearsal of $FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "Decrypted: $(grep -c 'CREATE TABLE' backup.sql) tables in the file." >> "$GITHUB_STEP_SUMMARY"

      - name: Create the throwaway database (EU)
        run: |
          set -euo pipefail
          npx wrangler d1 delete "$SCRATCH" --skip-confirmation >/dev/null 2>&1 || true
          npx wrangler d1 create "$SCRATCH" --jurisdiction eu
          ID="$(npx wrangler d1 info "$SCRATCH" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("{")));console.log(j.uuid)})')"
          printf 'name = "restore-rehearsal"\ncompatibility_date = "2026-09-01"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\nmigrations_dir = "lib/db/migrations"\n' "$SCRATCH" "$ID" > rehearsal.toml

      - name: Load the backup into it
        run: |
          set -euo pipefail
          START=$(date +%s)
          node .github/scripts/order-export.mjs backup.sql backup.ordered.sql
          if ! npx wrangler d1 execute "$SCRATCH" -c rehearsal.toml --remote --file backup.ordered.sql --yes > load.log 2>&1; then
            # Surface wrangler's own error line (truncated) so it shows on the run page.
            grep -E "ERROR|Error|error" load.log | tail -3 | cut -c1-300 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          tail -5 load.log
          echo "SECONDS_TAKEN=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Check every table's row count against the file
        id: counts
        run: node .github/scripts/restore-rehearsal.mjs backup.sql "$SCRATCH" rehearsal.toml

      - name: Apply migrations newer than the backup
        run: npx wrangler d1 migrations apply "$SCRATCH" -c rehearsal.toml --remote

      - name: Database integrity check
        run: |
          OUT="$(npx wrangler d1 execute "$SCRATCH" -c rehearsal.toml --remote --json --command "PRAGMA quick_check" 2>&1 || true)"
          if echo "$OUT" | grep -q '"quick_check": *"ok"'; then echo "Integrity check: ok" >> "$GITHUB_STEP_SUMMARY";
          elif echo "$OUT" | grep -qi "not authorized\|not supported\|SQLITE_AUTH"; then echo "Integrity check not available on D1; skipped." >> "$GITHUB_STEP_SUMMARY";
          else echo "$OUT"; echo "::error::Integrity check did not return ok."; exit 1; fi

      - name: Delete the throwaway database
        if: always()
        run: |
          rm -f backup.sql backup.ordered.sql backup.enc load.log
          npx wrangler d1 delete "$SCRATCH" --skip-confirmation || echo "::warning::Could not delete $SCRATCH; delete it in Cloudflare → D1."

      - name: Report success
        if: success()
        env:
          SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
        run: |
          echo "Passed: ${{ steps.counts.outputs.tables }} tables, ${{ steps.counts.outputs.rows }} rows, restored in ${SECONDS_TAKEN}s." >> "$GITHUB_STEP_SUMMARY"
          curl -fsS -X POST -H "x-cron-secret: $SECRET" -H "Content-Type: application/json" \
            -d "{\"ok\":true,\"file\":\"$FILE\",\"tables\":${{ steps.counts.outputs.tables || 0 }},\"rows\":${{ steps.counts.outputs.rows || 0 }},\"seconds\":${SECONDS_TAKEN:-0}}" \
            https://activityroster.com/api/ops/restore-rehearsal-report || echo "::warning::Report call failed (the rehearsal itself passed)."

      - name: Report failure
        if: failure()
        env:
          SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
        run: |
          curl -fsS -X POST -H "x-cron-secret: $SECRET" -H "Content-Type: application/json" \
            -d "{\"ok\":false,\"file\":\"${FILE:-}\",\"error\":\"Restore rehearsal failed. See GitHub Actions run ${{ github.run_id }}.\"}" \
            https://activityroster.com/api/ops/restore-rehearsal-report || true
