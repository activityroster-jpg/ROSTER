name: Deploy production

# Production deploys only when Conor presses "Run workflow" here (that click is
# the approval). Staging deploys itself on every push, so test there first.
#
# What a production deploy does, in order:
#   1. typecheck + tests (including the tenant-isolation suite)
#   2. build
#   3. record the D1 Time Travel bookmark (the restore point) in the run summary
#   4. first time only: mark the migrations already applied by hand as applied
#   5. apply any pending migrations to the production database
#   6. deploy the Worker
#   7. smoke test; on failure roll back to the previous Worker version
#   8. tag the commit prod-<date> and point the `main` branch at it
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy"
        required: true
        default: "claude/new-session-2wxbwe"

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APEX_DOMAIN: activityroster.com
    steps:
      - name: Check deploy secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck and tests
        run: |
          npm run typecheck:core
          npm run test

      - name: Build
        run: npx opennextjs-cloudflare build

      - name: Record the Time Travel bookmark (restore point)
        run: |
          echo "### Production deploy of $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "D1 Time Travel bookmark before this deploy (use with 'wrangler d1 time-travel restore activityroster --bookmark=…' if a rollback of data is ever needed):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 time-travel info activityroster --json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: First time only, mark hand-applied migrations as applied
        run: |
          set -euo pipefail
          HAS="$(npx wrangler d1 execute activityroster --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='d1_migrations'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log((r[0]&&r[0].results&&r[0].results.length)?"yes":"no")})')"
          if [ "$HAS" = "no" ]; then
            echo "Bootstrapping d1_migrations: migrations 0000–0039 were applied by hand before this workflow existed."
            SQL="CREATE TABLE IF NOT EXISTS d1_migrations(id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);"
            for f in $(ls lib/db/migrations/*.sql | sort); do
              base="$(basename "$f")"
              num="${base%%_*}"
              if [ "$num" -le 39 ]; then SQL="$SQL INSERT OR IGNORE INTO d1_migrations(name) VALUES ('$base');"; fi
            done
            npx wrangler d1 execute activityroster --remote --command "$SQL"
          else
            echo "d1_migrations already present."
          fi

      - name: Apply pending migrations (production)
        run: npx wrangler d1 migrations apply activityroster --remote

      - name: Remember the current Worker version (for rollback)
        id: prev
        run: |
          PREV="$(npx wrangler versions list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s);console.log(l[0]?l[0].id:"")}catch{console.log("")}})')"
          echo "id=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous version: ${PREV:-unknown}"

      - name: Deploy production
        run: npx wrangler deploy

      - name: Smoke test
        id: smoke
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://activityroster.com/api/health | grep -q '"ok":true' && curl -fsS -o /dev/null https://activityroster.com/ && curl -fsS -o /dev/null https://activityroster.com/login; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            hdr="$(curl -sS -o /dev/null -D - https://activityroster.com/api/health || true)"
            code="$(printf '%s' "$hdr" | head -1 | awk '{print $2}')"
            echo "Health check answered HTTP ${code:-none}"
            if printf '%s' "$hdr" | grep -qi '^cf-mitigated: challenge'; then
              echo "::error::Cloudflare challenged the smoke test (HTTP 403, cf-mitigated: challenge). This is Bot Fight Mode blocking GitHub's test request, not the app. Turn it off: Cloudflare dashboard → activityroster.com → Security → Bots → Bot Fight Mode → Off (Turnstile and rate limits still protect the forms). Then press Deploy production again. The deploy has been rolled back so production is unchanged."
            else
              echo "::error::Production smoke test failed (HTTP ${code:-none} from /api/health, or the home or sign-in page did not load)."
            fi
            exit 1
          fi
          echo "production healthy"

      - name: Roll back if the smoke test failed
        if: failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.id != ''
        run: |
          echo "::warning::Rolling back to Worker version ${{ steps.prev.outputs.id }}"
          npx wrangler rollback "${{ steps.prev.outputs.id }}" --message "Automatic rollback: smoke test failed" || true

      - name: Tag the release and point main at it
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="prod-$(date -u +%Y%m%d-%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
          git push --force origin HEAD:refs/heads/main
          echo "Tagged $TAG and updated main." >> "$GITHUB_STEP_SUMMARY"
