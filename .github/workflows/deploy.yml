name: Deploy

# Builds the app with OpenNext and deploys it to Cloudflare Workers whenever
# the working branch is pushed (after typecheck + tests), or on demand from
# the Actions tab. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   – an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  – from the Workers & Pages overview page (right-hand side)
# Until both exist the job prints a warning and does nothing.

on:
  push:
    branches: ["claude/new-session-2wxbwe"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set, so nothing was deployed. Add them under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci || npm install

      - name: Typecheck and tests
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm run typecheck:core
          npm run test

      - name: Build and deploy to Cloudflare Workers
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APEX_DOMAIN: activityroster.com
        run: npm run cf:deploy
