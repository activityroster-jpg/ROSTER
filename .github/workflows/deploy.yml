name: Deploy

# Deploys the app to Cloudflare on every push to the default branch, and on
# demand via the "Run workflow" button. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — a token with Workers Scripts:Edit (+ D1/R2/KV/Workers
#                           Routes edit) for the ActivityRoster account
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
# It does NOT run database migrations (those are applied manually in the D1
# console to avoid clashing with the hand-applied history).

on:
  push:
    branches: ["claude/new-session-2wxbwe"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare
    runs-on: ubuntu-latest
    # Skip automatically if the deploy token isn't configured yet, so pushes
    # don't show a red X before the secret is added.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - name: Build & deploy (OpenNext + Wrangler)
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APEX_DOMAIN: activityroster.com
