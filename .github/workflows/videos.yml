name: Make videos

# Makes the how-to videos from the scripts in videos/scripts, on a throwaway
# copy of the app with a made-up centre (never staging or production), and
# keeps the finished files for 30 days as a download on this run's page:
# Actions → Make videos → the run → Artifacts → activityroster-videos.
# Every video is checked before it's kept (the table on the run's page); the
# run only succeeds, and the deploy only publishes the set, when all pass.
#
# The narration voice comes from whichever key is set (Settings → Secrets and
# variables → Actions): ELEVENLABS_API_KEY (recommended), GOOGLE_TTS_API_KEY,
# or AZURE_SPEECH_KEY. With none, a free preview voice is used, good enough to
# check the timing. Only the script text is sent to the voice service. With
# the ElevenLabs key, a logo sting and a music bed are made once and reused.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Video numbers to make, comma separated (blank = every video with a script). The others are kept from the last run if they passed there."
        required: false
        default: ""
  push:
    branches: ["claude/new-session-2wxbwe"]
    paths: ["videos/**", ".github/workflows/videos.yml"]

permissions:
  contents: read
  actions: read # to keep the videos that passed in the last run (see "Which videos to make")

concurrency:
  group: videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  videos:
    runs-on: ubuntu-24.04
    # All 12 videos are recorded in real time, then encoded: allow for the whole set.
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_APEX_DOMAIN: localhost:8787
      NEXT_PUBLIC_APEX_DOMAIN: localhost:8787
      VIDEO_BASE: http://demo.localhost:8788
      DEV_LOG: videos-dev.log
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci || npm install
      - name: Install the browser and ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Preview voice (only when no voice key is set)
        run: |
          if [ -n "$ELEVENLABS_API_KEY$GOOGLE_TTS_API_KEY$AZURE_SPEECH_KEY" ]; then echo "Using the voice service."; exit 0; fi
          echo "No voice key set: using the free preview voice."
          pip install -q "piper-tts==1.2.0" || { echo "::warning::Preview voice unavailable; the video will have captions but no voice."; exit 0; }
          mkdir -p "$RUNNER_TEMP/piper"
          base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alan/medium
          curl -sSL -o "$RUNNER_TEMP/piper/en_GB-alan-medium.onnx" "$base/en_GB-alan-medium.onnx" \
            && curl -sSL -o "$RUNNER_TEMP/piper/en_GB-alan-medium.onnx.json" "$base/en_GB-alan-medium.onnx.json" \
            && echo "PIPER_MODEL=$RUNNER_TEMP/piper/en_GB-alan-medium.onnx" >> "$GITHUB_ENV" \
            || echo "::warning::Preview voice unavailable; the video will have captions but no voice."
      - name: Reuse narration already made (so unchanged lines aren't paid for twice)
        uses: actions/cache@v6
        with:
          path: videos/.cache
          key: videocache-${{ hashFiles('videos/scripts/**', 'videos/lib/brand-audio.mjs') }}
          restore-keys: videocache-
      - name: Local settings (a throwaway secret, made fresh each run)
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "BETTER_AUTH_URL=http://localhost:8787"
            echo "APP_APEX_DOMAIN=localhost:8787"
            echo "APP_ENV=development"
          } > .dev.vars
      - name: Local database and the made-up centres
        run: |
          npx wrangler d1 migrations apply DB --local
          SEED_DB="$(ls .wrangler/state/v3/d1/miniflare-D1DatabaseObject/*.sqlite | grep -v metadata)" npm run videos:seed
          # A clean copy: every video starts from it, so none depends on what an earlier one did.
          echo "CLEAN_DB=$RUNNER_TEMP/clean-demo.sqlite" >> "$GITHUB_ENV"
          CLEAN_DB="$RUNNER_TEMP/clean-demo.sqlite" bash videos/reset-demo.sh snapshot
      - name: Start the app
        run: |
          nohup npx next dev -p 8787 > videos-dev.log 2>&1 &
          nohup node e2e/proxy.mjs > videos-proxy.log 2>&1 &
          for i in $(seq 1 150); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 http://demo.localhost:8788/sign-in || true)"
            [ "$code" = "200" ] && echo "app is up" && exit 0
            sleep 2
          done
          echo "::error::The app didn't start"; tail -50 videos-dev.log; exit 1
      - name: Which videos to make
        # Pressed by hand: the numbers typed in (blank = all). On a push: only the
        # videos whose script changed; anything else under videos/ (the recorder,
        # the checks, the cards, the voice) changes every video, so all are made.
        id: which
        env:
          ONLY_INPUT: ${{ inputs.only }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          only=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            only="$(echo "$ONLY_INPUT" | tr -d ' ')"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git fetch -q --depth=1 origin "$BEFORE"; then
            changed="$(git diff --name-only "$BEFORE" HEAD -- videos .github/workflows/videos.yml)"
            echo "Changed since the last push:"; echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^videos/scripts/[0-9][0-9]-.*\.mjs$'; then
              only="$(echo "$changed" | sed -E 's#^videos/scripts/0?([0-9]+)-.*#\1#' | sort -n | uniq | paste -sd, -)"
            fi
          fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
          if [ -n "$only" ]; then echo "Making video(s) $only; the others are kept from the last run if they passed there."; else echo "Making every video."; fi
      - name: Keep the videos that passed in the last run
        if: ${{ steps.which.outputs.only != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/carry"
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow videos.yml --status completed --limit 20 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .databaseId'); do
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name activityroster-videos --dir "$RUNNER_TEMP/carry" 2>/dev/null && [ -f "$RUNNER_TEMP/carry/checks.md" ]; then
              echo "Keeping the videos that passed in run $run:"; cat "$RUNNER_TEMP/carry/checks.md"; exit 0
            fi
            rm -rf "$RUNNER_TEMP/carry"; mkdir -p "$RUNNER_TEMP/carry"
          done
          echo "::warning::No earlier set of videos to keep (they're kept 30 days); only the videos made now will be in this run's download."
      - name: Make the videos
        # Each video: a fresh demo centre, record, edit out dead air, then check
        # the finished file (lib/qa.mjs). A video that fails its checks is made
        # again (up to three tries); if it still fails, this step fails, so the
        # set isn't published.
        env:
          VIDEO_RESET: bash videos/reset-demo.sh
          VIDEO_CARRY: ${{ runner.temp }}/carry
          ONLY: ${{ steps.which.outputs.only }}
        run: node videos/make.mjs ${ONLY:+--only "$ONLY"}
      - name: Keep the videos for download
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: activityroster-videos
          path: videos/out/
          retention-days: 30
      - name: Summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          {
            echo "## How-to videos"
            echo
            echo "Download them from **Artifacts → activityroster-videos** at the bottom of this page."
            echo
            if [ -f videos/out/checks.md ]; then cat videos/out/checks.md; echo; fi
            for f in videos/out/*/*.mp4; do echo "- $(basename "$f") · $(du -h "$f" | cut -f1)"; done
            for f in videos/out/*/*-youtube.txt; do echo "- $(basename "$f"): $(grep '^VOICE:' "$f" || true)"; done
            for f in videos/out/*/*-warnings.txt; do echo; echo "⚠ $(basename "$f"):"; sed 's/^/    /' "$f"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the server log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-log
          path: videos-dev.log
          retention-days: 7
