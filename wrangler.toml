name = "roster"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# --- Routing ---------------------------------------------------------------
# The apex serves the marketing site (custom domain, auto-manages its DNS +
# cert). The wildcard route sends every centre subdomain
# ({slug}.activityroster.com) to this Worker, which resolves the org from the
# host. NOTE: a wildcard ROUTE still needs a matching *proxied* DNS record —
# add a CNAME `*` → activityroster.com (Proxied) in Cloudflare DNS once; a
# route cannot create that record itself.
routes = [
  { pattern = "activityroster.com", custom_domain = true },
  { pattern = "*.activityroster.com/*", zone_name = "activityroster.com" },
]

# Static assets produced by the OpenNext build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# --- Cloudflare D1 (single multi-tenant DB, EU-pinned) ---------------------
# Create with: wrangler d1 create activityroster --location=weur
[[d1_databases]]
binding = "DB"
database_name = "activityroster"
database_id = "40f47084-458a-471e-bd82-27dcc85c55dd"
migrations_dir = "lib/db/migrations"

# --- Cloudflare R2 (private certificate/vetting documents, EU) --------------
# Create with: wrangler r2 bucket create activityroster-docs --location=weur
[[r2_buckets]]
binding = "DOCS"
bucket_name = "activityroster-docs"

# --- KV for tenant/org lookup caching --------------------------------------
[[kv_namespaces]]
binding = "TENANT_CACHE"
id = "34fc102ca9744f0793d3e0adb3bf31e1"

# Non-secret vars. Secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# BETTER_AUTH_SECRET, SENTRY_DSN, …) are set with `wrangler secret put`.
[vars]
APP_APEX_DOMAIN = "activityroster.com"
APP_ENV = "production"

# --- Staging ----------------------------------------------------------------
# A full copy of the stack for testing before production: its own Worker, D1,
# R2 (EU jurisdiction), KV and secrets, served at staging.activityroster.com
# with centres at {slug}.staging.activityroster.com. Resource ids are filled in
# by the "Provision staging" GitHub Actions workflow. DNS: the custom domain
# below is created automatically; add one proxied CNAME `*.staging` →
# `staging.activityroster.com` by hand for the centre subdomains.
[env.staging]
name = "roster-staging"
routes = [
  { pattern = "staging.activityroster.com", custom_domain = true },
  { pattern = "*.staging.activityroster.com/*", zone_name = "activityroster.com" },
]

[env.staging.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "activityroster-staging"
database_id = "STAGING_D1_ID"
migrations_dir = "lib/db/migrations"

[[env.staging.r2_buckets]]
binding = "DOCS"
bucket_name = "activityroster-docs-staging"
jurisdiction = "eu"

[[env.staging.kv_namespaces]]
binding = "TENANT_CACHE"
id = "STAGING_KV_ID"

[env.staging.vars]
APP_APEX_DOMAIN = "staging.activityroster.com"
APP_ENV = "staging"
